services:

  postgres-db:
    image: postgres:17
    container_name: my_postgres_db

    environment:
      POSTGRES_USER: myuserdb
      POSTGRES_PASSWORD: mypassdb
      POSTGRES_DB: mydbname

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuserdb -d mydbname"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  airflow-db:
    image: postgres:17
    container_name: airflow_metadata_db

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile

    container_name: airflow_init

    depends_on:
      airflow-db:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow

    entrypoint: /bin/bash

    command:
      - -c
      - |
        airflow db migrate

        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true

    restart: "no"


  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile

    container_name: airflow_webserver

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock

    ports:
      - "8080:8080"

    command: webserver
    restart: unless-stopped


  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile

    container_name: airflow_scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock

    command: scheduler
    restart: unless-stopped


  # Image used by the Airflow DockerOperator
  dlt_loading:
    profiles:
      - jobs

    build:
      context: .
      dockerfile: dlt/Dockerfile

    image: dlt_loading:latest
    pull_policy: build
    container_name: dlt_loading

    depends_on:
      postgres-db:
        condition: service_healthy

    environment:
      DESTINATION__POSTGRES__CREDENTIALS__HOST: postgres-db
      DESTINATION__POSTGRES__CREDENTIALS__PORT: "5432"
      DESTINATION__POSTGRES__CREDENTIALS__DATABASE: mydbname
      DESTINATION__POSTGRES__CREDENTIALS__USERNAME: myuserdb
      DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: mypassdb

    restart: "no"


  # Image used by a future Airflow DBT task
  dbt:
    profiles:
      - jobs

    build:
      context: ./dbt
      dockerfile: Dockerfile

    image: dbt_dwh:latest
    pull_policy: build
    container_name: dbt_dwh

    depends_on:
      postgres-db:
        condition: service_healthy

    restart: "no"


  # Image used by the Airflow DockerOperator
  from-stg-to-dwh:
    profiles:
      - jobs

    build:
      context: ./workers/from_stg_to_dwh
      dockerfile: Dockerfile

    image: from_stg_to_dwh:latest
    pull_policy: build
    container_name: from_stg_to_dwh_job

    depends_on:
      postgres-db:
        condition: service_healthy

    environment:
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: myuserdb
      POSTGRES_PASSWORD: mypassdb
      POSTGRES_DB: mydbname

    restart: "no"


volumes:
  airflow_db_data:
  postgres_data:


networks:
  default:
    name: db_practice_default